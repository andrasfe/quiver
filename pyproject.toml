[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The PyPI distribution name. Different from the import name `quiver`
# because the bare `quiver` namespace is already taken on PyPI.
# Install with:  pip install quiver-circuits
# Import with:   import quiver
name = "quiver-circuits"
version = "0.1.0"
description = "Quantum circuit exploration framework that finds multiple structurally diverse solutions to problems with known target outcomes."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Quiver Contributors" }]
keywords = [
    "quantum-computing",
    "variational-quantum-eigensolver",
    "vqe",
    "qaoa",
    "quantum-circuits",
    "ansatz",
    "diversity",
    "circuit-search",
    "quantum-machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
pennylane = ["pennylane>=0.34"]
qiskit = ["qiskit>=1.0"]
ibm = ["qiskit>=1.0", "qiskit-ibm-runtime>=0.20", "qiskit-aer>=0.13"]
dwave = ["dimod>=0.12", "dwave-system>=1.21"]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
all = [
    "pennylane>=0.34",
    "qiskit>=1.0",
    "qiskit-ibm-runtime>=0.20",
    "qiskit-aer>=0.13",
    "dimod>=0.12",
]

[project.urls]
Homepage = "https://github.com/andrasfe/quiver"
Repository = "https://github.com/andrasfe/quiver"
Issues = "https://github.com/andrasfe/quiver/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["quiver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
